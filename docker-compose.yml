# Local development.
#   docker compose up -d                   -> Postgres only (run the app from your IDE / ./mvnw)
#   docker compose --profile app up --build -> Postgres + the app built from source, like production
# Production deployment lives in deploy/compose.prod.yml.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      retries: 10

  ledger-service:
    profiles: [app]
    build: services/ledger-service
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  pgdata:
