# Local development stack. Every service is optional, so you can run any of them from your IDE instead.
#
#   docker compose up -d                                  -> infrastructure only: Postgres, Kafka, Keycloak, Redis, Mailpit
#   docker compose --profile app up -d --build            -> + every service, built from source
#   docker compose --profile web up -d --build            -> + the web app with everything it needs (gateway, core-service)
#   docker compose --profile <name> up -d --build         -> + one service: gateway | core | ledger | notification
#   docker compose --profile tools up -d                  -> + Kafka UI on http://localhost:8085
#
# Open http://localhost:5173 and sign in as demo@payledger.local / demo-password.
# Emails Keycloak sends (verification, password reset) land in Mailpit: http://localhost:8025.
# Keycloak admin console: http://localhost:8180 (admin / admin).
#
# Host ports and topic settings come from .env (copy .env.example). The defaults below work without one.
# Production deployment lives in deploy/compose.prod.yml.
name: payledger

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "${LEDGER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      retries: 10

  # Database-per-service: notification-service never touches the ledger's tables, only its events.
  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "${NOTIFICATION_DB_PORT:-5433}:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      retries: 10

  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    ports:
      - "${CORE_DB_PORT:-5434}:5432"
    volumes:
      - core-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      retries: 10

  # ---------------------------------------------------------------- identity
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 10

  # Sign-up, login, email verification, password reset. The "payledger" realm (client, scopes, a demo
  # user) is imported from deploy/local/keycloak on first start; later changes made in the admin
  # console are kept in keycloak-db.
  keycloak:
    image: keycloak/keycloak:26.8.0-0
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db: { condition: service_healthy }
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Tokens say "issued by http://localhost:8180" (what browsers see), while containers may call
      # Keycloak at http://keycloak:8080 for tokens and keys.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./deploy/local/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # No curl in the image: bash's /dev/tcp against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  # Catches every email locally; nothing is ever really sent.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # Gateway sessions (and, later, rate limits and caches).
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Two listeners: containers connect to kafka:29092, apps on your machine to localhost:${KAFKA_PORT}.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker, so every internal topic can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (kafka-init, or the owning service), never by a typo in a consumer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      start_period: 15s
      retries: 20

  # Creates topics up front so consumers can subscribe before the producing service has ever started.
  # ledger.commands.v1: core-service -> ledger-service. ledger.entries.v1 (the pre-pivot wallet event format) only exists for the parked notification-service.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ${LEDGER_EVENTS_TOPIC:-ledger.entries.v2} --partitions ${LEDGER_EVENTS_PARTITIONS:-3} --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ledger.entries.v1 --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ${LEDGER_COMMANDS_TOPIC:-ledger.commands.v1} --partitions ${LEDGER_COMMANDS_PARTITIONS:-3} --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe

  kafka-ui:
    profiles: [tools]
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"

  # ---------------------------------------------------------------- services
  # The web app, built and served by nginx, which forwards /api and login routes to the gateway.
  # Same port as `npm run dev`, so Keycloak's redirect URIs fit both; run one or the other.
  web:
    profiles: [app, web]
    build: web
    depends_on:
      gateway: { condition: service_started }
    ports:
      - "${WEB_PORT:-5173}:8080"

  # The only service a browser talks to: login, sessions, CSRF, routing with token relay.
  gateway:
    profiles: [app, gateway, web]
    build: services/gateway
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      CORE_SERVICE_URL: http://core-service:8060
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
      - "${GATEWAY_MANAGEMENT_PORT:-8001}:8001"

  core-service:
    profiles: [app, core, web]
    build: services/core-service
    depends_on:
      core-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      DB_URL: jdbc:postgresql://core-db:5432/core
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LEDGER_COMMANDS_TOPIC: ${LEDGER_COMMANDS_TOPIC:-ledger.commands.v1}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/payledger
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/payledger/protocol/openid-connect/certs
    ports:
      - "${CORE_PORT:-8060}:8060"
      - "${CORE_MANAGEMENT_PORT:-8061}:8061"

  ledger-service:
    profiles: [app, ledger]
    build: services/ledger-service
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LEDGER_EVENTS_TOPIC: ${LEDGER_EVENTS_TOPIC:-ledger.entries.v2}
      LEDGER_EVENTS_PARTITIONS: ${LEDGER_EVENTS_PARTITIONS:-3}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
      LEDGER_COMMANDS_TOPIC: ${LEDGER_COMMANDS_TOPIC:-ledger.commands.v1}
    ports:
      - "${LEDGER_PORT:-8080}:8080"
      - "${LEDGER_MANAGEMENT_PORT:-8081}:8081"

  notification-service:
    profiles: [app, notification]
    build: services/notification-service
    depends_on:
      notification-db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Parked: still reads the wallet-era v1 events, which nothing publishes any more.
      # It is repurposed for emails and the activity feed in Phase 6.
      LEDGER_EVENTS_TOPIC: ledger.entries.v1
    ports:
      - "${NOTIFICATION_PORT:-8090}:8090"
      - "${NOTIFICATION_MANAGEMENT_PORT:-8091}:8091"

volumes:
  pgdata:
  notification-pgdata:
  core-pgdata:
  keycloak-pgdata:
  kafkadata:
