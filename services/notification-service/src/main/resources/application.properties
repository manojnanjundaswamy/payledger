spring.application.name=notification-service

# Different defaults from ledger-service (8080/8081) so both run side by side from an IDE.
server.port=${PORT:8090}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database-per-service: this service never reads the ledger's tables, only its events.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/notifications}
spring.datasource.username=${DB_USER:notifications}
spring.datasource.password=${DB_PASSWORD:notifications}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

management.server.port=${MANAGEMENT_PORT:8091}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Kafka consumer ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=${spring.application.name}
# All instances of this service share one group, so each event is handled once per service (not once per instance).
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service}
# A brand-new group starts from the oldest retained event, so the feed can be rebuilt by resetting offsets.
spring.kafka.consumer.auto-offset-reset=earliest
# Commit each offset only after its record was handled (and its DB transaction committed): at-least-once.
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
spring.kafka.listener.observation-enabled=true
# Dead-letter publishing.
spring.kafka.producer.acks=all

payledger.events.ledger-topic=${LEDGER_EVENTS_TOPIC:ledger.entries.v1}
payledger.events.dead-letter-topic=${LEDGER_EVENTS_DLT:${spring.application.name}.ledger.entries.v1.dlt}
# Transient failures (DB down...) are retried this many times, this far apart, before the record is dead-lettered.
payledger.events.retry.attempts=${EVENT_RETRY_ATTEMPTS:4}
payledger.events.retry.interval=${EVENT_RETRY_INTERVAL:1s}
