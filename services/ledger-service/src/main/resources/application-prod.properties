# Activated with SPRING_PROFILES_ACTIVE=prod

# One JSON object per log line (Elastic Common Schema), ready for Loki / ELK / CloudWatch.
logging.structured.format.console=ecs

# Fail fast instead of running an unauthenticated money API on the internet.
payledger.security.require-api-key=true

spring.datasource.hikari.leak-detection-threshold=10000
