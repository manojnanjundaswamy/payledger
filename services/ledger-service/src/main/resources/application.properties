spring.application.name=ledger-service

# PORT is set by PaaS hosts such as Render; defaults to 8080 everywhere else.
server.port=${PORT:8080}
# Trust X-Forwarded-* from the reverse proxy (Caddy) so redirects/Location headers use https://<domain>.
server.forward-headers-strategy=framework
# Finish in-flight requests on SIGTERM (docker stop / redeploy) before shutting down.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}
# Virtual threads make threads cheap, so the connection pool becomes the real concurrency limit: size it on purpose.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Never run SQL while rendering the HTTP response: all data access stays inside services.
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# Actuator lives on a separate port that is never exposed through the reverse proxy.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Comma-separated API keys. Empty = auth disabled (local dev only; the prod profile refuses to start without keys).
payledger.security.api-keys=${API_KEYS:}
payledger.security.require-api-key=false
