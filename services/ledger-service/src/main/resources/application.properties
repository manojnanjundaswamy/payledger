spring.application.name=ledger-service

# PORT is set by PaaS hosts such as Render; defaults to 8080 everywhere else.
server.port=${PORT:8080}
# Trust X-Forwarded-* from the reverse proxy (Caddy) so redirects/Location headers use https://<domain>.
server.forward-headers-strategy=framework
# Finish in-flight requests on SIGTERM (docker stop / redeploy) before shutting down.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}
# Virtual threads make threads cheap, so the connection pool becomes the real concurrency limit: size it on purpose.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Never run SQL while rendering the HTTP response: all data access stays inside services.
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# Actuator lives on a separate port that is never exposed through the reverse proxy.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Comma-separated API keys. Empty = auth disabled (local dev only; the prod profile refuses to start without keys).
payledger.security.api-keys=${API_KEYS:}
payledger.security.require-api-key=false

# ---- Kafka + transactional outbox (docs/adr/0004-transactional-outbox.md) ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=${spring.application.name}
# Durable writes: the leader waits for all in-sync replicas. Idempotence stops retries from duplicating or reordering.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail a send quickly when Kafka is unreachable, instead of blocking the relay; the batch is retried on the next poll.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=15000

payledger.outbox.topic=${LEDGER_EVENTS_TOPIC:ledger.entries.v1}
payledger.outbox.partitions=${LEDGER_EVENTS_PARTITIONS:3}
payledger.outbox.replicas=${LEDGER_EVENTS_REPLICAS:1}
payledger.outbox.retention=${OUTBOX_RETENTION:7d}
payledger.outbox.cleanup-interval=1h
# false = run without Kafka: events still queue up in outbox_events and are sent once the relay is enabled.
payledger.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
payledger.outbox.relay.poll-interval=${OUTBOX_POLL_INTERVAL:500ms}
payledger.outbox.relay.batch-size=${OUTBOX_BATCH_SIZE:100}
payledger.outbox.relay.send-timeout=20s
