spring.application.name=gateway

# The only service the browser talks to. In development the web app's dev server (5173) proxies
# /api, /oauth2, /login and /logout here, so cookies stay first-party.
server.port=${PORT:8000}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.threads.virtual.enabled=true

management.server.port=${MANAGEMENT_PORT:8001}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

payledger.frontend-url=${FRONTEND_URL:http://localhost:5173}
payledger.core-service-url=${CORE_SERVICE_URL:http://localhost:8060}
payledger.keycloak-public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
payledger.realm=${KEYCLOAK_REALM:payledger}

# ---- Sessions: server-side in Redis, so the gateway can be restarted or scaled without logging anyone out ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.redis.namespace=payledger:session
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}
# Cookie name, HttpOnly and SameSite are set in SessionConfig. Secure must be true behind HTTPS.
payledger.cookie-secure=${COOKIE_SECURE:false}

# ---- Login with Keycloak ----
# Browser-facing URLs use KEYCLOAK_PUBLIC_URL; server-to-server calls (token, keys, user info) use
# KEYCLOAK_INTERNAL_URL, which differs inside Docker (http://keycloak:8080). No issuer-uri on purpose:
# it would make startup depend on reaching Keycloak's discovery document.
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:payledger-gateway}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:local-dev-gateway-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=${payledger.keycloak-public-url}/realms/${payledger.realm}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_INTERNAL_URL:${payledger.keycloak-public-url}}/realms/${payledger.realm}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:${payledger.keycloak-public-url}}/realms/${payledger.realm}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_INTERNAL_URL:${payledger.keycloak-public-url}}/realms/${payledger.realm}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
