spring.application.name=core-service

server.port=${PORT:8060}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/core}
spring.datasource.username=${DB_USER:core}
spring.datasource.password=${DB_PASSWORD:core}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

management.server.port=${MANAGEMENT_PORT:8061}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Authentication: access tokens issued by Keycloak, relayed by the gateway ----
# The issuer is the URL browsers use; the keys can be fetched over a different (container-internal) URL.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/payledger}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
# Only tokens minted for this API (Keycloak client scope "payledger-api").
spring.security.oauth2.resourceserver.jwt.audiences=payledger-api

# ---- Kafka + transactional outbox: ledger commands (docs/events/ledger-commands.md) ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=${spring.application.name}
# Durable writes: the leader waits for all in-sync replicas. Idempotence stops retries from duplicating or reordering.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail a send quickly when Kafka is unreachable, instead of blocking the relay; the batch is retried on the next poll.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=15000

payledger.outbox.topic=${LEDGER_COMMANDS_TOPIC:ledger.commands.v1}
payledger.outbox.partitions=${LEDGER_COMMANDS_PARTITIONS:3}
payledger.outbox.replicas=${LEDGER_COMMANDS_REPLICAS:1}
payledger.outbox.retention=${OUTBOX_RETENTION:7d}
payledger.outbox.cleanup-interval=1h
# false = run without Kafka: commands still queue up in outbox_events and are sent once the relay is enabled.
payledger.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
payledger.outbox.relay.poll-interval=${OUTBOX_POLL_INTERVAL:500ms}
payledger.outbox.relay.batch-size=${OUTBOX_BATCH_SIZE:100}
payledger.outbox.relay.send-timeout=20s

# ---- Reading balances and totals from ledger-service (internal network) ----
payledger.ledger.url=${LEDGER_URL:http://localhost:8080}
payledger.ledger.api-key=${LEDGER_API_KEY:}
payledger.ledger.timeout=${LEDGER_TIMEOUT:2s}

# Plans (docs/plan/market-and-pricing.md). Emails listed here have Premium without paying: the team, beta
# testers, and the local demo user (so the e2e tests never meet a Free limit).
payledger.plans.complimentary=${PREMIUM_EMAILS:}

# ---- Admin console (docs/adr/0008-admin-console.md) ----
# These emails are OWNER in the admin console without a database row, so there is always a way in.
payledger.admin.owners=${ADMIN_EMAILS:}
# Days for active users, sign-ups and retention.
payledger.business-zone=${BUSINESS_ZONE:Asia/Kolkata}
# Keycloak's admin API, for creating users, their emails, and blocking sign-in. Blank secret = not configured:
# those actions answer 503 identity-unavailable and the rest of the console works.
payledger.identity.url=${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
payledger.identity.realm=payledger
payledger.identity.client-id=${IDENTITY_ADMIN_CLIENT_ID:payledger-core-admin}
payledger.identity.client-secret=${IDENTITY_ADMIN_CLIENT_SECRET:}
payledger.identity.timeout=5s

# ---- Email (docs/notifications.md) ----
# Locally Mailpit catches everything (http://localhost:8025). For real delivery set SMTP_* to a provider:
# Amazon SES, Brevo, Postmark, or Gmail with an app password while trying things out.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# A mail server being down must not mark the service unhealthy: emails wait in the outbox and are retried.
management.health.mail.enabled=false
payledger.mail.from=${MAIL_FROM:no-reply@payledger.local}
payledger.mail.from-name=${MAIL_FROM_NAME:PayLedger}
payledger.mail.enabled=${MAIL_ENABLED:true}
# Links in emails point here.
payledger.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Auto-capture (docs/hosting.md): forwarding addresses are <token>@CAPTURE_DOMAIN; the Email Worker posts with INBOUND_SECRET.
payledger.capture.domain=${CAPTURE_DOMAIN:in.payledger.local}
payledger.capture.inbound-secret=${INBOUND_SECRET:}

# Bank statements for auto-capture: up to 5 MB.
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=21MB
# The guest session cookie is Secure behind HTTPS (the hosted site), not on http://localhost.
payledger.cookie-secure=${COOKIE_SECURE:false}
payledger.push.subject=${PUSH_SUBJECT:mailto:hello@payledger.app}

# AI reading (docs/ai.md). Provider-independent: anthropic (Claude), openai-compatible (OpenAI, Gemini, Groq, Ollama, ...)
# or openrouter (many providers behind one key). No key = AI off; the rules and "To review" work as before.
payledger.ai.provider=${AI_PROVIDER:anthropic}
payledger.ai.base-url=${AI_BASE_URL:}
payledger.ai.api-key=${AI_API_KEY:}
payledger.ai.model=${AI_MODEL:claude-haiku-5-5}
payledger.ai.timeout=${AI_TIMEOUT:20s}
# US dollars per million tokens (and per minute of audio): only for the cost log. Set them to your model's prices.
payledger.ai.price.input-per-million=${AI_PRICE_INPUT:1.0}
payledger.ai.price.output-per-million=${AI_PRICE_OUTPUT:5.0}
payledger.ai.price.audio-per-minute=${AI_PRICE_AUDIO_MINUTE:0.006}
# What was sent and answered is cleared after this; tokens, cost and outcome are kept.
payledger.ai.text-retention=${AI_TEXT_RETENTION:180d}
# Speech to text for browsers that can't do it on the device (OpenAI-style /audio/transcriptions: OpenAI, Groq).
payledger.ai.stt.base-url=${STT_BASE_URL:https://api.openai.com/v1}
payledger.ai.stt.api-key=${STT_API_KEY:}
payledger.ai.stt.model=${STT_MODEL:gpt-4o-mini-transcribe}
