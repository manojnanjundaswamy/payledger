server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers. nginx drops server-level add_header in any location that sets its own,
    # so every location that adds a header includes them again.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Login, logout and API: to the gateway, keeping the browser's Host so OAuth redirects come back here.
    location ~ ^/(api|oauth2|login/oauth2|logout)(/|$) {
        proxy_pass ${GATEWAY_URL};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Hashed assets never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all serve the app; index.html itself is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
