# Behind a tunnel or load balancer (Cloudflare) the browser used https even though nginx hears http: keep what the
# proxy in front says, so OAuth redirects and cookies use the address the browser really sees.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers. nginx drops server-level add_header in any location that sets its own,
    # so every location that adds a header includes them again.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Login, logout and API: to the gateway, keeping the browser's Host so OAuth redirects come back here.
    # Look the gateway up again every 10 s (Docker's DNS by default): when it is recreated on a deploy it gets a new
    # address, and a name resolved once at startup would answer 502 until nginx restarted.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    location ~ ^/(api|oauth2|login/oauth2|logout|inbound)(/|$) {
        set $gateway ${GATEWAY_URL};
        # An import sends the whole CSV file (core-service allows 2 MB of text); nginx's default is 1 MB.
        client_max_body_size 4m;
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Sign-in, sign-up and password pages (Keycloak), when hosted on one address. Only this realm and its static
    # files: the master realm and the admin console are never reachable from outside.
    location ~ ^/(realms/payledger|resources)(/|$) {
        set $keycloak ${KEYCLOAK_URL};
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        # Keycloak's cookies and redirects make for large response headers.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Hashed assets never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all serve the app; index.html itself is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
