<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Budgets, households and shared expenses in one place." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PayLedger</title>
    <script>
      // Apply the last theme before React loads, so there is no white flash in dark mode.
      try {
        var t = JSON.parse(localStorage.getItem('payledger.theme') || 'null')
        var dark = t && t.mode === 'dark' || (!t || t.mode === 'system') && matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (t && t.vars) for (var k in t.vars) document.documentElement.style.setProperty(k, t.vars[k])
        if (t && t.width) document.documentElement.dataset.width = t.width
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
