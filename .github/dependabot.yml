version: 2
updates:
  - package-ecosystem: maven
    directory: /services/ledger-service
    schedule: { interval: weekly }
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*", "org.springdoc*"]
    ignore:
      # Must match the Postgres major used in production (postgres:17); upgrade deliberately, not via bot.
      - dependency-name: "io.zonky.test.postgres:embedded-postgres-binaries-bom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /services/ledger-service
    schedule: { interval: weekly }
    ignore:
      # Java version is a project decision (pom java.version + CI), not a base-image bump.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /services/notification-service
    schedule: { interval: weekly }
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*", "org.springdoc*"]
  - package-ecosystem: docker
    directory: /services/notification-service
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /services/core-service
    schedule: { interval: weekly }
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*", "org.springdoc*"]
  - package-ecosystem: docker
    directory: /services/core-service
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /services/gateway
    schedule: { interval: weekly }
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*"]
    ignore:
      # Spring Cloud 2025.1 supports Boot 4.0 only. Move to Boot 4.1 together with Spring Cloud 2026.0 GA.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /services/gateway
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      local-stack:
        patterns: ["*"]
    ignore:
      # Postgres majors must move together with production and Testcontainers.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Keycloak 26.8 makes every new sign-up set their password twice (UPDATE_PASSWORD right after
      # email verification). Stay on 26.4 until a release passes scripts/login-smoke-test.sh.
      - dependency-name: "keycloak/keycloak"
        versions: ["26.8.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
